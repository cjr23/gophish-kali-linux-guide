# Configuration GitHub Pages — référencement Google (SEO)
title: "Installer GoPhish sur Kali Linux en laboratoire isolé — revue scientifique"
description: "Guide scientifique et protocole reproductible pour installer GoPhish sur Kali Linux en environnement isolé, à des fins de sensibilisation défensive au phishing (hameçonnage)."
lang: fr
locale: fr_FR
author:
  name: Christian Gilbert Fodé Diouf
  url: https://personal-portfolio-bay-one-49.vercel.app/
url: "https://cjr23.github.io"
baseurl: "/gophish-kali-linux-guide"

# Informations communes aux deux langues
# (les textes traduits sont dans _data/i18n.json)
paper:
  author: "Christian Gilbert Fodé Diouf"
  short_name: "Christian G. F. Diouf"
  version: "2.0"
  photo: "/assets/img/christian-diouf.jpg"
  avatar: "/assets/img/christian-diouf-avatar.jpg"
  email: "christiandiouf23@gmail.com"
  github: "https://github.com/cjr23"
  portfolio: "https://personal-portfolio-bay-one-49.vercel.app/"
  repo: "https://github.com/cjr23/gophish-kali-linux-guide"
  license: "CC BY 4.0"
  license_url: "https://creativecommons.org/licenses/by/4.0/"

# Version anglaise : README.en.md est publiée à l'adresse /en/
defaults:
  - scope:
      path: "README.en.md"
    values:
      layout: default
      permalink: /en/
      lang: en
      locale: en_US
      description: "A reproducible protocol for installing GoPhish on Kali Linux in an isolated lab, written for defensive phishing awareness training."

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Google Search Console (méthode « Balise HTML ») : colle ici uniquement
